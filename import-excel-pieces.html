<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Import de pièces en masse</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EEF1F0;
      --ink: #16232B;
      --ink-soft: #5E6C72;
      --navy: #16232B;
      --line: #DADFE0;
      --card: #FFFFFF;
      --accent: #E07B2E;
      --teal: #2F7D6B;
      --teal-soft: #E5F1EE;
      --danger: #C0503D;
      --danger-soft: #F7E9E6;
      --radius: 10px;
      --font-display: 'IBM Plex Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-display);
      background: var(--bg);
      color: var(--ink);
      padding: 20px;
    }

    #wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    #card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(22, 35, 43, 0.06);
    }

    #head {
      background: var(--navy);
      color: #fff;
      padding: 20px 28px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    #head h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    #head .sub {
      font-family: var(--font-mono);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
    }

    /* ---------------- SELECTEUR BATIMENT ---------------- */
    #building-block {
      padding: 22px 28px;
      border-bottom: 1px solid var(--line);
    }

    .label {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-soft);
      margin-bottom: 8px;
      display: block;
    }

    #building-search-wrap {
      position: relative;
      max-width: 460px;
    }

	#building-search {
	  width: 100%;
	  padding: 11px 14px;
	  border-radius: 8px;
	  border: 1.5px solid var(--line);
	  font-size: 14.5px;
	  font-family: var(--font-display);
	  outline: none;
	  background: #fff;
	  color: var(--ink); /* ← couleur du texte tapé */
	}

    #building-search::placeholder {
      color: var(--ink-soft);
      font-size: 14.5px;
    }

    #building-search:focus {
      border-color: var(--accent);
    }

    #building-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(22, 35, 43, 0.12);
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 20;
    }

    #building-suggestions.open {
      display: block;
    }

    .sugg-row {
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
    }

    .sugg-row:last-child {
      border-bottom: none;
    }

    .sugg-row:hover {
      background: var(--bg);
    }

    .sugg-code {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
    }

    .sugg-name {
      font-size: 13.5px;
    }

    #building-selected {
      display: none;
      margin-top: 12px;
      align-items: center;
      justify-content: space-between;
      background: var(--teal-soft);
      border-radius: 8px;
      padding: 10px 14px;
    }

    #building-selected .info {
      font-size: 13.5px;
      line-height: 1.5;
    }

    #building-selected .info b {
      font-family: var(--font-mono);
      color: var(--teal);
    }

    #building-selected button {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 12.5px;
      text-decoration: underline;
      cursor: pointer;
    }

    #building-notfound {
      display: none;
      margin-top: 12px;
      font-size: 13.5px;
      color: var(--ink-soft);
    }

    #building-notfound button {
      margin-left: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ---------------- FIN SELECTEUR BATIMENT ---------------- */

    #file-upload {
      margin: 20px 0;
      padding: 20px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      background: var(--bg);
    }

    #file-upload input[type="file"] {
      display: none;
    }

    #preview-table-wrap {
      margin-top: 20px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    #preview-table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
    }

    #preview-table th,
    #preview-table td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      font-size: 13px;
    }

    #preview-table th {
      background: var(--navy);
      color: #fff;
      font-size: 11.5px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }

    #import-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--ink);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy);
      color: #fff;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 60;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="card">
      <div id="head">
        <h1>Import de pièces en masse</h1>
      </div>
      <div id="building-block">
        <label class="label">SÉLECTIONNER UN BÂTIMENT</label>
        <div id="building-search-wrap">
          <input id="building-search" type="text" placeholder="Rechercher par code ou nom de bâtiment…" autocomplete="off" />
          <div id="building-suggestions"></div>
        </div>
        <div id="building-selected">
          <div class="info">
            <b id="bs-code"></b> — <span id="bs-nom"></span><br />
            <span id="bs-adresse"></span>
          </div>
          <button id="bs-change">Changer</button>
        </div>
      </div>

      <div style="padding: 22px 28px;">
        <label class="label">Importer un fichier Excel</label>
        <div id="file-upload">
          <input type="file" id="file-input" accept=".xlsx, .xls" />
          <p>Glissez-déposez un fichier Excel ou cliquez pour sélectionner</p>
        </div>

        <div id="preview-section" style="display: none; margin-top: 20px;">
          <label class="label">Aperçu des données</label>
          <div id="preview-table-wrap">
            <table id="preview-table">
              <thead>
                <tr>
                  <th>Code bâtiment</th>
                  <th>Numéro local</th>
                  <th>Nom local</th>
                  <th>Niveau</th>
                  <th>Typologie</th>
                  <th>Surface (m²)</th>
                  <th>Service occupant</th>
                  <th>Sous-service</th>
                  <th>Nb occupants</th>
                  <th>Nb PDT</th>
                  <th>Nature opérationnelle</th>
                  <th>Numéro CAT</th>
                </tr>
              </thead>
              <tbody id="preview-body"></tbody>
            </table>
          </div>
        </div>

        <div id="import-actions" style="display: none; margin-top: 20px;">
          <button id="btn-import" class="btn btn-primary">Importer les données</button>
          <button id="btn-cancel" class="btn btn-secondary">Annuler</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <script>
    // Configuration (à adapter selon votre document Grist)
    const CONFIG = {
      tables: {
        inventaire: "BATIMENTS",
        pieces: "PIECES",
        services: "LIST_SERVICE",
        typologie: "TYPOLOGIE",
      },
      inventaire: {
        id: "id",
        code: "code_batiment",
        nom: "nom_batiment",
        adresse: "adresse",
        ville: "ville",
        codePostal: "code_postal",
      },
      pieces: {
        id: "id_piece",
        batimentRef: "code_batiment",
        niveau: "niveau",
        numero: "numero_local",
        nom: "nom_local",
        typologie: "typologie_pie",
        serviceRef: "service_occupant",
        sousService: "sous_service",
        surface: "surface",
        nbOccupant: "nb_occupant",
        nbPdt: "nb_pdt",
        natureOperationnelle: "nature_operationnelle",
        numCat: "num_cat",
        classTypologie: "class_typologie",
        nbResident: "nb_resident",
        pourcentageResident: "pourcentage_resident",
      },
      services: {
        id: "id",
        nom: "nom_service",
      },
      typologie: {
        id: "id",
        label: "ID_typo",
      },
    };

    // Variables globales
    let buildings = [];
    let services = [];
    let typologies = [];
    let selectedBuilding = null;
    let excelData = [];

    // Fonction pour afficher un toast
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    // Fonction pour valider les données d'une ligne
    function validateData(row) {
      const errors = [];

      // Colonnes obligatoires (doivent être présentes et non vides)
      const requiredFields = [
        { name: "code_batiment", value: row["code_batiment"] },
        { name: "numero_local", value: row["numero_local"] },
        { name: "surface", value: row["surface"] },
      ];

      requiredFields.forEach(field => {
        if (field.value === undefined || field.value === null || field.value === "") {
          errors.push(`La colonne "${field.name}" est vide.`);
        }
      });

      // Vérifier que la surface est un nombre valide
      if (row["surface"] && isNaN(parseFloat(row["surface"]))) {
        errors.push(`La colonne "surface" doit être un nombre valide.`);
      }

      // Vérifier que nb_occupant et nb_pdt sont des nombres valides (s'ils ne sont pas vides)
      if (row["nb_occupant"] && row["nb_occupant"] !== "" && isNaN(Number(row["nb_occupant"]))) {
        errors.push(`La colonne "nb_occupant" doit être un nombre valide.`);
      }

      if (row["nb_pdt"] && row["nb_pdt"] !== "" && isNaN(Number(row["nb_pdt"]))) {
        errors.push(`La colonne "nb_pdt" doit être un nombre valide.`);
      }

      return errors;
    }

    // Convertir les données de Grist en tableau d'objets
    function toRows(table) {
      if (!table || !table.id) return [];
      const rows = [];
      for (let i = 0; i < table.id.length; i++) {
        const row = { id: table.id[i] };
        for (const key of Object.keys(table)) {
          if (key === "id") continue;
          row[key] = table[key][i];
        }
        rows.push(row);
      }
      return rows;
    }

    // Charger les données depuis Grist
    async function loadAll() {
      try {
        const [inv, srv, typ] = await Promise.all([
          grist.docApi.fetchTable(CONFIG.tables.inventaire),
          grist.docApi.fetchTable(CONFIG.tables.services),
          grist.docApi.fetchTable(CONFIG.tables.typologie),
        ]);
        buildings = toRows(inv);
        services = toRows(srv);
        typologies = toRows(typ);
        console.log("Données chargées avec succès :", { buildings, services, typologies });
      } catch (err) {
        console.error("Erreur lors du chargement des données :", err);
        showToast("Erreur lors du chargement des données depuis Grist.");
      }
    }

    // Sélectionner un bâtiment
    function selectBuilding(id) {
      const c = CONFIG.inventaire;
      selectedBuilding = buildings.find(b => b.id === id);
      document.getElementById("building-search").value = "";
      document.getElementById("building-suggestions").classList.remove("open");

      document.getElementById("building-selected").style.display = "flex";
      document.getElementById("bs-code").textContent = selectedBuilding[c.code] || "";
      document.getElementById("bs-nom").textContent = selectedBuilding[c.nom] || "";
      document.getElementById("bs-adresse").textContent =
        [selectedBuilding[c.adresse], selectedBuilding[c.codePostal], selectedBuilding[c.ville]].filter(Boolean).join(", ");
    }

    // Recherche de bâtiments
    document.getElementById("building-search").addEventListener("input", () => {
      const q = document.getElementById("building-search").value.trim().toLowerCase();
      const suggBox = document.getElementById("building-suggestions");
      suggBox.innerHTML = "";
      if (!q) {
        suggBox.classList.remove("open");
        return;
      }

      const c = CONFIG.inventaire;
      const matches = buildings.filter(b =>
        String(b[c.code] || "").toLowerCase().includes(q) ||
        String(b[c.nom] || "").toLowerCase().includes(q)
      ).slice(0, 8);

      if (matches.length) {
        suggBox.innerHTML = matches.map(b => `
          <div class="sugg-row" data-id="${b.id}">
            <div class="sugg-code">${b[c.code] || ""}</div>
            <div class="sugg-name">${b[c.nom] || "Sans nom"}</div>
          </div>
        `).join("");
        suggBox.classList.add("open");
        suggBox.querySelectorAll(".sugg-row").forEach(el => {
          el.addEventListener("click", () => selectBuilding(Number(el.dataset.id)));
        });
      } else {
        suggBox.classList.remove("open");
      }
    });

    // Changer de bâtiment
    document.getElementById("bs-change").addEventListener("click", () => {
      selectedBuilding = null;
      document.getElementById("building-selected").style.display = "none";
    });

    // Gestion du fichier Excel
    document.getElementById("file-upload").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.name.endsWith(".xlsx") && !file.name.endsWith(".xls")) {
        showToast("Veuillez sélectionner un fichier Excel (.xlsx ou .xls).");
        return;
      }
      readExcelFile(file);
    });

    // Lire le fichier Excel
    function readExcelFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        // defval: "" garantit que chaque ligne possède TOUTES les colonnes de l'en-tête,
        // même quand une cellule est vide (sinon SheetJS omet purement et simplement la clé,
        // ce qui faussait ensuite la détection de "colonnes manquantes" ci-dessous).
        excelData = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

        if (!excelData.length) {
          showToast("Le fichier ne contient aucune ligne de données.");
          return;
        }

        // Colonnes requises dans le fichier Excel
        const requiredColumns = [
          "code_batiment",
          "nom_batiment",
          "niveau",
          "numero_local",
          "nom_local",
          "typologie_pie",
          "service_occupant",
          "sous_service",
          "surface",
          "nb_occupant",
          "nb_pdt",
          "nature_operationnelle",
          "num_cat"
        ];

        // Vérifier les en-têtes réellement présents dans le fichier (pas seulement
        // dans la première ligne de données, qui peut être trompeuse si une cellule est vide)
        const headerRow = XLSX.utils.sheet_to_json(firstSheet, { header: 1 })[0] || [];
        const missingColumns = requiredColumns.filter(col => !headerRow.includes(col));

        if (missingColumns.length > 0) {
          console.warn(`En-têtes absents du fichier : ${missingColumns.join(", ")}. Elles seront traitées comme vides.`);
          excelData.forEach(row => {
            missingColumns.forEach(col => {
              if (!(col in row)) row[col] = "";
            });
          });
        }

        previewData();
      };
      reader.readAsArrayBuffer(file);
    }

    // Aperçu des données
    function previewData() {
      const previewBody = document.getElementById("preview-body");
      previewBody.innerHTML = "";

      if (!excelData || excelData.length === 0) {
        showToast("Aucune donnée valide trouvée dans le fichier.");
        return;
      }

      // Afficher les 10 premières lignes
      excelData.slice(0, 10).forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row["code_batiment"] || ""}</td>
          <td>${row["numero_local"] || ""}</td>
          <td>${row["nom_local"] || ""}</td>
          <td>${row["niveau"] || ""}</td>
          <td>${row["typologie_pie"] || ""}</td>
          <td>${row["surface"] || ""}</td>
          <td>${row["service_occupant"] || ""}</td>
          <td>${row["sous_service"] || ""}</td>
          <td>${row["nb_occupant"] || ""}</td>
          <td>${row["nb_pdt"] || ""}</td>
          <td>${row["nature_operationnelle"] || ""}</td>
          <td>${row["num_cat"] || ""}</td>
        `;
        previewBody.appendChild(tr);
      });

      document.getElementById("preview-section").style.display = "block";
      document.getElementById("import-actions").style.display = "block";
    }

    // Importer les données
    document.getElementById("btn-import").addEventListener("click", async () => {
      if (!excelData || excelData.length === 0) {
        showToast("Aucune donnée à importer.");
        return;
      }

      try {
        console.log("Début de l'import. Nombre de lignes à importer :", excelData.length);

        const p = CONFIG.pieces;
        const actions = [];
        const unknownBuildings = new Set();
        const unknownServices = new Set();
        const unknownTypologies = new Set();

        for (const [index, row] of excelData.entries()) {
          console.log(`Traitement de la ligne ${index + 1} :`, row);

          // Valider les données de la ligne
          const validationErrors = validateData(row);
          if (validationErrors.length > 0) {
            console.error(`Ligne ${index + 1} : Erreurs de validation - ${validationErrors.join(" ")}`);
            continue;
          }

          // Vérifier si le bâtiment existe
          const buildingCode = row["code_batiment"];
          if (!buildingCode) {
            console.error(`Ligne ${index + 1} : La colonne "code_batiment" est manquante ou vide.`);
            continue;
          }

          const building = buildings.find(b => b[CONFIG.inventaire.code] === buildingCode);
          if (!building) {
            console.error(`Ligne ${index + 1} : Bâtiment non trouvé pour le code "${buildingCode}".`);
            unknownBuildings.add(buildingCode);
            continue;
          }
          console.log(`Ligne ${index + 1} : Bâtiment trouvé - ID : ${building.id}`);

          // Trouver le service
          const service = services.find(s => s[CONFIG.services.nom] === row["service_occupant"]);
          if (!service) {
            console.error(`Ligne ${index + 1} : Service non trouvé pour "${row["service_occupant"]}".`);
            unknownServices.add(row["service_occupant"]);
          } else {
            console.log(`Ligne ${index + 1} : Service trouvé - ID : ${service.id}`);
          }

          // Trouver la typologie
          const typologie = typologies.find(t => t[CONFIG.typologie.label] === row["typologie_pie"]);
          if (!typologie) {
            console.error(`Ligne ${index + 1} : Typologie non trouvée pour "${row["typologie_pie"]}".`);
            unknownTypologies.add(row["typologie_pie"]);
          } else {
            console.log(`Ligne ${index + 1} : Typologie trouvée - ID : ${typologie.id}`);
          }

          // Vérifier la nature opérationnelle
          let opValue = null;
          if (row["nature_operationnelle"] === "Oui") opValue = true;
          if (row["nature_operationnelle"] === "Non") opValue = false;
          console.log(`Ligne ${index + 1} : Nature opérationnelle : ${opValue}`);

          // Ajouter l'action pour cette pièce
          actions.push(["AddRecord", CONFIG.tables.pieces, null, {
            [p.batimentRef]: building.id,
            [p.niveau]: row["niveau"] || "",
            [p.numero]: row["numero_local"] || "",
            [p.nom]: row["nom_local"] || "",
            [p.typologie]: typologie ? typologie.id : null,
            [p.surface]: parseFloat(row["surface"]) || 0,
            [p.serviceRef]: service ? service.id : null,
            [p.sousService]: row["sous_service"] || "",
            [p.nbOccupant]: row["nb_occupant"] ? Number(row["nb_occupant"]) : null,
            [p.nbPdt]: row["nb_pdt"] ? Number(row["nb_pdt"]) : null,
            [p.natureOperationnelle]: opValue,
            [p.numCat]: row["num_cat"] || "",
            // class_typologie est une colonne formule dans Grist : elle se calcule
            // automatiquement et ne peut pas recevoir de valeur écrite directement
            // (sinon Grist renvoie "Can't save value to formula column").
            // Si nb_resident / pourcentage_resident sont aussi des colonnes formule
            // dans votre document, retirez-les de la même façon.
            [p.nbResident]: null,
            [p.pourcentageResident]: null,
          }]);
          console.log(`Ligne ${index + 1} : Action ajoutée avec succès.`);
        }

        console.log("Nombre total d'actions préparées :", actions.length);

        // Afficher les erreurs si des bâtiments, services ou typologies sont inconnus
        let errorMessages = [];
        if (unknownBuildings.size > 0) {
          errorMessages.push(`Bâtiments non reconnus : ${Array.from(unknownBuildings).join(", ")}.`);
        }
        if (unknownServices.size > 0) {
          errorMessages.push(`Services non reconnus : ${Array.from(unknownServices).join(", ")}.`);
        }
        if (unknownTypologies.size > 0) {
          errorMessages.push(`Typologies non reconnues : ${Array.from(unknownTypologies).join(", ")}.`);
        }

        if (errorMessages.length > 0) {
          showToast(errorMessages.join(" "));
        }

        if (actions.length > 0) {
          console.log("Tentative d'application des actions...");
          const result = await grist.docApi.applyUserActions(actions);
          console.log("Résultat de l'import :", result);
          showToast(`Import réussi : ${actions.length} pièces ajoutées.`);
        } else {
          showToast("Aucune pièce valide à importer.");
        }

        document.getElementById("preview-section").style.display = "none";
        document.getElementById("import-actions").style.display = "none";
        excelData = [];
      } catch (err) {
        console.error("Erreur détaillée lors de l'import :", err);
        showToast("Erreur lors de l'import. Vérifiez les logs dans la console pour plus de détails.");
      }
    });

    // Annuler l'import
    document.getElementById("btn-cancel").addEventListener("click", () => {
      document.getElementById("preview-section").style.display = "none";
      document.getElementById("import-actions").style.display = "none";
      excelData = [];
      document.getElementById("file-input").value = "";
    });

    // Initialisation
    grist.ready({ requiredAccess: "full" });
    grist.onRecords(() => loadAll());
    loadAll();
  </script>
</body>
</html>
